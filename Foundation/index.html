<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>D3 - Calculator</h1>
    </header>
    <main>
      <article class="calculator" id="calculator">
        <div class="calc-shell">
          <h2 class="page-title">Smart Calculator</h2>
          <div class="calc-display" id="display">0</div>

          <div class="button-grid">
            <button type="button" class="clear" data-action="clear">C</button>
            <button type="button" class="operator" data-action="operator" data-value="÷">÷</button>
            <button type="button" class="operator" data-action="operator" data-value="×">×</button>
            <button type="button" class="operator" data-action="operator" data-value="-">−</button>

            <button type="button" data-action="digit" data-value="7">7</button>
            <button type="button" data-action="digit" data-value="8">8</button>
            <button type="button" data-action="digit" data-value="9">9</button>
            <button type="button" class="operator" data-action="operator" data-value="+">+</button>

            <button type="button" data-action="digit" data-value="4">4</button>
            <button type="button" data-action="digit" data-value="5">5</button>
            <button type="button" data-action="digit" data-value="6">6</button>
            <button type="button" class="equal" data-action="calculate">=</button>

            <button type="button" data-action="digit" data-value="1">1</button>
            <button type="button" data-action="digit" data-value="2">2</button>
            <button type="button" data-action="digit" data-value="3">3</button>
            <button type="button" data-action="digit" data-value="0">0</button>

            <button type="button" data-action="digit" data-value=".">.</button>
          </div>
        <div class="history-panel" id="history-panel">
          <h2>Calculation History</h2>
          <ul class="history-list" id="history"></ul>
        </div>
      </article>

      <article class="todo-app" id="todo-app">
        <h2 class="page-title">Task List</h2>
        <div class="todo-input">
          <input id="task-input" type="text" placeholder="Add a task" />
          <button id="task-add" type="button">Add</button>
        </div>
        <div class="todo-controls">
          <span id="todo-count">0 active</span>
          <div class="todo-filters">
            <button type="button" data-filter="all" class="active">All</button>
            <button type="button" data-filter="active">Active</button>
            <button type="button" data-filter="completed">Completed</button>
          </div>
        </div>
        <ul id="task-list" class="task-list"></ul>
      </article>
    </main>

    <footer>
      <p>© 2026</p>
    </footer>
    <script src="calculator.js"></script>
    <script src="ui.js"></script>
    <script src="tasks.js"></script>
  </body>
</html>
