<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <style>
      :root {
        --primary: #256d85;
        --dark: #1f2a44;
        --bg: #f4f7fa;
        --light: #ffffff;
        --text: #5c6c85;
        --border: #d9e2ec;
      }

      * { box-sizing: border-box; }
      body { margin: 0; padding: 0; font-family: system-ui, sans-serif; color: var(--dark); background: var(--bg); overflow-x: hidden; }

      header { background: linear-gradient(135deg, var(--primary), #1f4459); color: white; padding: 32px 20px; text-align: center; }
      nav { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; margin-top: 12px; }
      nav a { color: white; text-decoration: none; padding: 0.6rem 1rem; border-radius: 4px; background: rgba(255,255,255,0.12); transition: 0.2s; }
      nav a:hover { background: rgba(255,255,255,0.24); }

      main { max-width: 980px; margin: 0 auto; padding: 40px 20px; }
      .page-title { margin: 0 0 12px; font-size: 2rem; color: var(--dark); }
      .calculator { display: grid; grid-template-columns: 1fr 320px; gap: 24px; align-items: start; }
      .calc-shell { background: var(--light); border: 1px solid var(--border); border-radius: 24px; padding: 24px; box-shadow: 0 20px 40px rgba(31, 42, 68, 0.08); }
      .calc-display { min-height: 100px; background: #1f2a44; color: white; font-size: 2rem; display: flex; align-items: center; justify-content: flex-end; padding: 24px; border-radius: 18px; word-break: break-word; }
      .button-grid { display: grid; grid-template-columns: repeat(4, minmax(64px, 1fr)); gap: 12px; margin-top: 20px; }
      .button-grid button { border: none; border-radius: 16px; padding: 18px 0; font-size: 1.05rem; font-weight: 600; cursor: pointer; transition: transform 0.12s ease, background 0.2s ease; }
      .button-grid button:hover { transform: translateY(-1px); }
      .button-grid button.operator { background: var(--primary); color: white; }
      .button-grid button.equal { background: #1d8d73; color: white; }
      .button-grid button.clear { background: #d6455d; color: white; }
      .button-grid button.placeholder { visibility: hidden; pointer-events: none; }
      .history-panel { background: var(--light); border: 1px solid var(--border); border-radius: 24px; padding: 24px; max-height: 560px; overflow-y: auto; }
      .history-panel h2 { margin-top: 0; font-size: 1.2rem; }
      .history-list { list-style: none; margin: 0; padding: 0; }
      .history-list li { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; padding: 14px 0; border-bottom: 1px solid #eef2f6; }
      .history-list li:last-child { border-bottom: none; }
      .history-expression { color: #546e7a; font-size: 0.95rem; }
      .history-result { color: var(--dark); font-weight: 700; }
      .notice { margin-top: 18px; color: var(--text); font-size: 0.95rem; }
      footer { text-align: center; padding: 30px 20px; color: var(--text); border-top: 1px solid var(--border); margin-top: 40px; }

      @media (max-width: 900px) {
        .calculator { grid-template-columns: 1fr; }
      }

      @media (max-width: 640px) {
        header { padding: 24px 16px; }
        main { padding: 24px 16px; }
        .calc-display { font-size: 1.75rem; min-height: 88px; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Calculator</h1>
      <nav>
        <a href="#calculator">Calculator</a>
        <a href="#history">History</a>
      </nav>
    </header>

    <main>
      <article class="calculator" id="calculator">
        <div class="calc-shell">
          <h2 class="page-title">Smart Calculator</h2>
          <div class="calc-display" id="display">0</div>

          <div class="button-grid">
            <button type="button" class="clear" data-action="clear">C</button>
            <button type="button" class="operator" data-action="operator" data-value="÷">÷</button>
            <button type="button" class="operator" data-action="operator" data-value="×">×</button>
            <button type="button" class="operator" data-action="operator" data-value="-">−</button>

            <button type="button" data-action="digit" data-value="7">7</button>
            <button type="button" data-action="digit" data-value="8">8</button>
            <button type="button" data-action="digit" data-value="9">9</button>
            <button type="button" class="operator" data-action="operator" data-value="+">+</button>

            <button type="button" data-action="digit" data-value="4">4</button>
            <button type="button" data-action="digit" data-value="5">5</button>
            <button type="button" data-action="digit" data-value="6">6</button>
            <button type="button" class="equal" data-action="calculate">=</button>

            <button type="button" data-action="digit" data-value="1">1</button>
            <button type="button" data-action="digit" data-value="2">2</button>
            <button type="button" data-action="digit" data-value="3">3</button>
            <button type="button" data-action="digit" data-value="0">0</button>

            <button type="button" data-action="digit" data-value=".">.</button>
            <button type="button" class="placeholder"></button>
            <button type="button" class="placeholder"></button>
            <button type="button" class="placeholder"></button>
          </div>

          <p class="notice">Tap numbers and operators to build an expression, then press =. Clear resets the current input. Calculations are saved below.</p>
        </div>

        <div class="history-panel" id="history-panel">
          <h2>Calculation History</h2>
          <ul class="history-list" id="history"></ul>
        </div>
      </article>
    </main>

    <footer>
      <p>© 2026 Calculator App</p>
    </footer>

    <script src="calc.js"></script>
  </body>
</html>
